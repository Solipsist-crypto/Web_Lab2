<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Market</title>
    <link rel="stylesheet" href="src/css/main.scss">

    <script type="module" src="src/js/main.js"></script>

</head>
<body>

    <div class="layout">

        <header class="header layout__header">
            <div class="header__logo">IT-Market</div>
            <div class="header__actions">
                <button type="button" class="header__button">Увійти</button>
                <button type="button" class="header__button">Кошик</button>
            </div>
        </header>

        <nav class="nav layout__nav">
            <a href="#" class="nav__link">Головна</a>
            <a href="#" class="nav__link">Каталог</a>
            <a href="#" class="nav__link">Про нас</a>
        </nav>

        <aside class="sidebar layout__sidebar">
            <div class="filter">
                <div class="filter__header">
                    <h3 class="filter__title">Фільтри</h3>
                    <button type="button" class="filter__reset" id="reset-filters">Скинути</button>
                </div>

                <div class="filter__group">
                    <span class="filter__label">Пошук</span>
                    <input type="text" id="search-input" class="filter__input" placeholder="Назва товару...">
                    
                    <span class="filter__label">Сортування</span>
                    <select id="sort-select" class="filter__select">
                        <option value="default">Без сортування</option>
                        <option value="price-asc">Ціна ↑</option>
                        <option value="price-desc">Ціна ↓</option>
                        <option value="title">За назвою</option>
                    </select>
                </div>

                <div class="filter__group">
                    <span class="filter__label">Категорії</span>
                    
                    <label class="filter__item">
                        <input type="checkbox" class="filter__checkbox" data-filter="laptops">
                        <span class="filter__text">Ноутбуки</span>
                    </label>

                    <label class="filter__item">
                        <input type="checkbox" class="filter__checkbox" data-filter="smartphones">
                        <span class="filter__text">Смартфони</span>
                    </label>

                    <label class="filter__item">
                        <input type="checkbox" class="filter__checkbox" data-filter="gadgets">
                        <span class="filter__text">Девайси та інше</span>
                    </label>
                </div>

                <button type="button" id="clear-storage" class="filter__reset" style="margin-top: 20px; color: red;">Очистити всі дані</button>
            </div>
        </aside>

        <main class="main layout__main">
            <p class="stats" id="stats"></p>

            <form class="form" id="product-form" novalidate>
                <h2 class="form__title">Додати товар</h2>
                <div class="form__group">
                    <label for="prod-title">Назва</label>
                    <input type="text" id="prod-title" name="title" required minlength="3">
                </div>
                <div class="form__group">
                    <label for="prod-price">Ціна (грн)</label>
                    <input type="number" id="prod-price" name="price" required min="1">
                </div>
                <div class="form__group">
                    <label for="prod-category">Категорія</label>
                    <select id="prod-category" name="category" required>
                        <option value="">Оберіть...</option>
                        <option value="laptops">Ноутбуки</option>
                        <option value="smartphones">Смартфони</option>
                        <option value="gadgets">Девайси та інше</option>
                    </select>
                </div>
                <button type="submit" class="form__submit">Додати</button>
                <p class="form__error" id="form-error"></p>
            </form>

            <div class="product-grid" id="product-grid"></div>
        </main>

        <footer class="footer layout__footer">
            <p>© 2026 IT-Market. Всі права захищено.</p>
        </footer>

    </div>

</body>
</html>
